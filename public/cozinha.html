<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha - Painel de Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header style="background-color: #d32f2f;">
    <h1>🍳 Painel da Cozinha</h1>
    <p>Pedidos em Tempo Real</p>
  </header>

  <div id="containerPedidos">
    <p>Aguardando novos pedidos...</p>
  </div>

  <!-- Som de Notificação de Novo Pedido -->
  <audio id="somAlerta" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let totalPedidosAnterior = 0;

    socket.on('atualizar_pedidos', (pedidos) => {
      const container = document.getElementById('containerPedidos');
      
      // Toca um bipe sonoro se um novo pedido entrou
      if (pedidos.length > totalPedidosAnterior) {
        document.getElementById('somAlerta').play().catch(() => {});
      }
      totalPedidosAnterior = pedidos.length;

      // Filtra apenas os pedidos que importam para a cozinha (não entregues)
      const pedidosCozinha = pedidos.filter(p => p.status !== 'ENTREGUE');

      if (pedidosCozinha.length === 0) {
        container.innerHTML = '<div class="card"><h3>Nenhum pedido pendente no momento! 🎉</h3></div>';
        return;
      }

      container.innerHTML = '';

      pedidosCozinha.forEach(p => {
        let listaItens = p.itens.map(i => `<li><b>${i.nome}</b></li>`).join('');
        
        let botaoAcao = '';
        if (p.status === 'PENDENTE') {
          botaoAcao = `<button class="btn-warning" onclick="mudarStatus(${p.id}, 'EM_PREPARO')">👨‍🍳 Iniciar Preparo</button>`;
        } else if (p.status === 'EM_PREPARO') {
          botaoAcao = `<button onclick="mudarStatus(${p.id}, 'CONCLUIDO')">✅ Marcar como Pronto</button>`;
        } else {
          botaoAcao = `<p style="color: green; font-weight: bold;">Aguardando Retirada/Entrega</p>`;
        }

        container.innerHTML += `
          <div class="card status-${p.status}">
            <div style="display: flex; justify-content: space-between;">
              <h3>MESA ${p.mesa} (${p.cliente})</h3>
              <small>${p.horario}</small>
            </div>
            <hr style="margin: 10px 0;">
            <ul style="margin-left: 20px; font-size: 18px;">${listaItens}</ul>
            <br>
            <p><b>Status:</b> ${p.status}</p>
            ${botaoAcao}
          </div>
        `;
      });
    });

    function mudarStatus(idPedido, novoStatus) {
      socket.emit('atualizar_status_pedido', { idPedido, novoStatus });
    }
  </script>
</body>
</html>
