<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Pesque e Pague</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎣 Pesque e Pague</h1>
    <p>Faça seu pedido direto da sua mesa!</p>
  </header>

  <!-- Login/Mesa -->
  <div id="sec-identificacao" class="card">
    <h3>Sua Mesa</h3>
    <label>Número da Mesa:</label>
    <input type="number" id="numMesa" placeholder="Ex: 5" value="5">
    
    <label>Seu Nome:</label>
    <input type="text" id="nomeCliente" placeholder="Digite seu nome">
    
    <label>PIN da Mesa (Fornecido pelo Garçom):</label>
    <input type="password" id="pinMesa" placeholder="Digite o PIN (Teste: 1234)">
  </div>

  <!-- Cardápio -->
  <div id="sec-cardapio" class="card">
    <h3>📋 Cardápio</h3>
    
    <div class="item-cardapio">
      <div>
        <strong>Porção de Traíra Frita</strong><br>
        <small>R$ 65,00</small>
      </div>
      <button onclick="adicionarItem('Porção de Traíra', 65.00)">+ Add</button>
    </div>

    <div class="item-cardapio">
      <div>
        <strong>Porção de Batata Frita</strong><br>
        <small>R$ 30,00</small>
      </div>
      <button onclick="adicionarItem('Batata Frita', 30.00)">+ Add</button>
    </div>

    <div class="item-cardapio">
      <div>
        <strong>Cerveja 600ml</strong><br>
        <small>R$ 14,00</small>
      </div>
      <button onclick="adicionarItem('Cerveja 600ml', 14.00)">+ Add</button>
    </div>

    <div class="item-cardapio">
      <div>
        <strong>Refrigerante Lata</strong><br>
        <small>R$ 6,00</small>
      </div>
      <button onclick="adicionarItem('Refrigerante Lata', 6.00)">+ Add</button>
    </div>
  </div>

  <!-- Carrinho -->
  <div class="card">
    <h3>🛒 Seu Pedido Atual</h3>
    <ul id="listaCarrinho" style="list-style: none; margin: 10px 0;"></ul>
    <h4>Total do Pedido: R$ <span id="totalCarrinho">0.00</span></h4>
    <button onclick="enviarPedido()">🚀 Enviar Pedido para a Cozinha</button>
  </div>

  <!-- Fechamento da Conta -->
  <div class="card" style="border: 2px solid #d32f2f;">
    <h3>💳 Deseja ir embora?</h3>
    <label>Forma de Pagamento Pretendida:</label>
    <select id="formaPagamento">
      <option value="PIX">Pix no Balcão</option>
      <option value="CARTAO">Cartão de Crédito/Débito</option>
      <option value="DINHEIRO">Dinheiro</option>
    </select>
    <button class="btn-danger" onclick="pedirAConta()">Pedir a Conta / Encerrar</button>
  </div>

  <!-- Socket.io e Lógica do Cliente -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let carrinho = [];
    let valorTotal = 0;

    function adicionarItem(nome, preco) {
      carrinho.push({ nome, preco });
      valorTotal += preco;
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const lista = document.getElementById('listaCarrinho');
      lista.innerHTML = '';
      carrinho.forEach((item, index) => {
        lista.innerHTML += `<li>${item.nome} - R$ ${item.preco.toFixed(2)}</li>`;
      });
      document.getElementById('totalCarrinho').innerText = valorTotal.toFixed(2);
    }

    function enviarPedido() {
      const mesa = document.getElementById('numMesa').value;
      const cliente = document.getElementById('nomeCliente').value;
      const pin = document.getElementById('pinMesa').value;

      if (!cliente || !mesa || !pin) {
        alert('Por favor, preencha o Nome, Mesa e o PIN!');
        return;
      }

      if (carrinho.length === 0) {
        alert('Seu carrinho está vazio!');
        return;
      }

      socket.emit('novo_pedido', {
        mesa,
        cliente,
        pin,
        itens: carrinho,
        total: valorTotal
      });
    }

    function pedirAConta() {
      const mesa = document.getElementById('numMesa').value;
      const formaPagamento = document.getElementById('formaPagamento').value;
      
      if (!mesa) {
        alert('Informe o número da mesa!');
        return;
      }

      if (confirm('Deseja realmente pedir a conta? Seu atendimento será finalizado no caixa.')) {
        socket.emit('solicitar_fechamento', { mesa, formaPagamento });
        alert('Solicitação enviada ao caixa! Por favor, dirija-se ao balcão para realizar o pagamento.');
        document.body.innerHTML = "<header><h1>🎣 Pesque e Pague</h1></header><div class='card'><h2>Conta Solicitada!</h2><p>Obrigado pela preferência. Dirija-se ao caixa para efetuar o pagamento.</p></div>";
      }
    }

    socket.on('sucesso_pedido', (msg) => {
      alert(msg);
      carrinho = [];
      valorTotal = 0;
      atualizarCarrinho();
    });

    socket.on('erro_pin', (msg) => {
      alert('❌ ' + msg);
    });
  </script>
</body>
</html>
