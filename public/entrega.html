<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega - Garçom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header style="background-color: #007bff;">
    <h1>🛵 Painel do Entregador</h1>
    <p>Pedidos prontos para entrega na mesa</p>
  </header>

  <div id="containerEntrega">
    <p>Carregando pedidos prontos...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('atualizar_pedidos', (pedidos) => {
      const container = document.getElementById('containerEntrega');
      
      // Filtra apenas os pedidos que já foram CONCLUÍDOS pela cozinha
      const prontos = pedidos.filter(p => p.status === 'CONCLUIDO');

      if (prontos.length === 0) {
        container.innerHTML = '<div class="card"><h3>Nenhum pedido aguardando entrega.</h3></div>';
        return;
      }

      container.innerHTML = '';

      prontos.forEach(p => {
        let listaItens = p.itens.map(i => `<li>${i.nome}</li>`).join('');

        container.innerHTML += `
          <div class="card status-CONCLUIDO">
            <h2>📍 MESA ${p.mesa}</h2>
            <p><b>Cliente:</b> ${p.cliente}</p>
            <ul style="margin-left: 20px; font-size: 16px; margin: 10px 0;">${listaItens}</ul>
            <button onclick="marcarEntregue(${p.id})">✅ Marcar como Entregue na Mesa</button>
          </div>
        `;
      });
    });

    function marcarEntregue(idPedido) {
      socket.emit('atualizar_status_pedido', { idPedido, novoStatus: 'ENTREGUE' });
    }
  </script>
</body>
</html>
